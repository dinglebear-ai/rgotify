name: rustify

x-common-service: &common-service
  networks:
    - rustify
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

services:
  gotify-mcp:
    <<: *common-service
    image: ghcr.io/jmagar/rustify:${RUSTIFY_VERSION:-latest}
    container_name: gotify-mcp
    env_file:
      - path: .env
        required: false
    ports:
      - "${GOTIFY_MCP_PORT:-40020}:40020/tcp"
    volumes:
      - ${HOME}/.gotify:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:40020/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  rustify:
    name: ${DOCKER_NETWORK:-rustify}
    external: true

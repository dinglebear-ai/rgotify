name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing vX.Y.Z release tag to resume
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  meta:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build hosted x86_64 release assets
    needs: [meta]
    uses: dinglebear-ai/workflows/.github/workflows/hosted-rust-platform-release.yml@78da20a9239e0abaf6ccd530427db3fe4266d264
    secrets: inherit
    with:
      checkout-ref: ${{ github.event.release.tag_name || inputs.tag_name }}
      targets-json: >-
        [{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
         {"runner":"windows-2025","target":"x86_64-pc-windows-msvc"}]
      build-command: cargo build --release --locked --target "$TARGET" --bin rgotify
      package-command: |
        set -euo pipefail
        mkdir -p dist
        if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
          artifact="rgotify-windows-x86_64.exe"
          archive="rgotify-windows-x86_64.tar.gz"
          source="target/$TARGET/release/rgotify.exe"
        else
          artifact="rgotify-linux-x86_64"
          archive="rgotify-x86_64.tar.gz"
          source="target/$TARGET/release/rgotify"
        fi
        cp "$source" "dist/$artifact"
        sha256sum "dist/$artifact" > "dist/$artifact.sha256"
        tar -C dist -czf "dist/$archive" "$artifact"
        sha256sum "dist/$archive" > "dist/$archive.sha256"
      artifact-path: dist/*
      artifact-prefix: rgotify

  github-release:
    name: Attach verified release assets
    needs: [build]
    uses: dinglebear-ai/workflows/.github/workflows/github-release.yml@d1a41a7af9c41189e0f1062234364f5814bda99d
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.tag_name }}
      artifact-pattern: rgotify-*

  npm:
    name: Publish npm launcher
    needs: [meta, github-release]
    uses: dinglebear-ai/workflows/.github/workflows/npm-trusted-publish.yml@64d705af6e164aac58d507df6fb2f6bdc8a4d22d
    with:
      checkout-ref: ${{ github.event.release.tag_name || inputs.tag_name }}
      expected-version: ${{ needs.meta.outputs.version }}
      working-directory: packages/gotify-rmcp
      enable-cache: false
      install-command: "true"
      verify-command: npm test && npm run check && npm pack --dry-run --json

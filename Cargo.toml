[workspace]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"
authors = ["dinglebear.ai <hello@dinglebear.ai>"]
license = "AGPL-3.0-only"
readme = "README.md"
homepage = "https://rgotify.dinglebear.ai"
repository = "https://github.com/dinglebear-ai/rgotify"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
dirs = "6.0.0"
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"
invalid_html_tags = "deny"
redundant_explicit_links = "warn"

[workspace.lints.rust]
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
mod_module_files = "deny"
missing_safety_doc = "deny"

[package]
name = "gotify-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
categories = ["command-line-utilities", "api-bindings", "network-programming", "development-tools"]
keywords = ["mcp", "gotify", "notifications", "rmcp", "homelab"]
description = "Gotify notifications and app, client, and message management over MCP and CLI."
autobins = false

[[bin]]
name = "rgotify"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# HTTP / MCP transport
axum.workspace = true
rmcp = { workspace = true, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "transport-io",
] }
tower-http = { workspace = true, features = ["cors", "limit", "trace"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
chrono = { workspace = true, features = ["serde"] }

# Config
toml.workspace = true

# OAuth + JWT
lab-auth = { git = "https://github.com/dinglebear-ai/labby.git", rev = "87cec3241f9baef22335de9cc8629ebbcd8ba047", package = "lab-auth" }
url.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# REST HTTP client
reqwest.workspace = true

# Errors
anyhow.workspace = true
dirs.workspace = true
dotenvy.workspace = true

[features]
test-support = []

[dev-dependencies]
gotify-mcp = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
rmcp = { workspace = true, features = [
  "client",
  "transport-child-process",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

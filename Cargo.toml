[package]
name = "gotify-mcp"
version = "0.1.2"
edition = "2021"
rust-version = "1.86"
categories = ["command-line-utilities", "development-tools"]
keywords = ["mcp", "gotify", "notifications", "rmcp", "homelab"]
repository = "https://github.com/jmagar/rgotify"
homepage = "https://github.com/jmagar/rgotify#readme"
description = "Rust MCP server and CLI for Gotify push notifications with stdio/HTTP transports, auth, and plugin packaging."
autobins = false

[[bin]]
name = "rgotify"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP / MCP transport
axum = "0.8"
rmcp = { version = "1.6.0", default-features = false, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "transport-io",
] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"

# OAuth + JWT
lab-auth = { git = "https://github.com/dinglebear-ai/labby.git", rev = "87cec3241f9baef22335de9cc8629ebbcd8ba047", package = "lab-auth" }
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# REST HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Errors
anyhow = "1"
dirs = "6.0.0"
dotenvy = "0.15.7"

[features]
test-support = []

[dev-dependencies]
gotify-mcp = { path = ".", features = ["test-support"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "1.6.0", default-features = false, features = [
  "client",
  "transport-child-process",
] }
